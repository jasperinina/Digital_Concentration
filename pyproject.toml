[project]
name = "normdev-focus"
version = "0.1.0"
description = "Десктоп-приложение NormDev: учет рабочего времени и управление цифровой концентрацией"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
